<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>

<body>

 <!-- Navbar Start -->

<nav class="navbar md:navbar-expand bg-dark">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold fs-xl" href="index.html">
                <span class="lgo1"> Food </span> <span class="lgo2">Palace</span>
            </a>

            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
                aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation" style="color: white;">

                <span class="navbar-toggler-icon"></span>
            </button>

            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">

                <div class="drawer-header">
                    <h5 class="drawer-title">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer"></button>
                </div>

                <div class="drawer-body mb-2 md:mb-0">

                    <ul class="nav navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active text-warning fw-semibold" href="aboutus.html">About Us</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" href="menu.html">
                                Menu
                            </a>

                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" href="contactus.html">Contact</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" href="form.html">Login</a>
                        </li>

                    </ul>

                </div>
            </dialog>

        </div>
    </nav>

    <!-- Navbar End -->

    <section class="text-white py-5">

        <div class="container text-center">

            <h1 class=" mb-3 " style="color: rgb(16, 217, 153);">Contact Us</h1>

            <p class="mb-0">
                We would love to hear from you. Get in touch with us!
            </p>

        </div>

    </section>



    <!-- Contact Form -->
    <section class="container-fluid my-5 form-sec">

        <div class="container p-7">
            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <h2 class="text-center mb-4  fs-4xl"  style="color: rgb(247, 166, 15);">Get In Touch</h2>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Your Email</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control" placeholder="Enter subject">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn px-5" style=" background-color: rgba(255, 149, 0, 0.914);  color: white; ">
                                Send Message
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </section>


 <!-- Footer -->

    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <h4 class="text-warning fw-bold">
                <span class="lgo1"> Food </span> <span class="lgo2">Palace</span>
            </h4>

            <p class="mb-2" style="color: white !important;">
                Delicious Food, Wonderful Experience.
            </p>

            <p class="text-secondary mb-0 " style="color: white !important;">
                © 2026 Food Palace. All Rights Reserved.
            </p>

        </div>

    </footer>

        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    </body>


</html>
